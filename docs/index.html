<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jukebox</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;padding:20px}
    main{max-width:900px;margin:0 auto}
    .jukebox-lyrics-window{border:1px solid #ddd;padding:10px;margin-top:10px;height:160px;overflow:auto}
    #trackList{list-style:none;padding:0}
    #trackList li{padding:6px 8px;border-bottom:1px solid #eee;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Jukebox</h1>

    <section id="nowPlaying">
      <strong>Now playing:</strong>
      <span id="nowPlayingTitle">(none)</span>
    </section>

    <section id="library" style="margin-top:12px">
      <h2>Track list</h2>
      <ul id="trackList">
        <!-- one sample track; jukebox.js will look for li[data-src] -->
        <li data-src="assets/audio/disgracefully.mp3">Disgracefully</li>
      </ul>
    </section>

    <!-- audio element the script expects -->
    <audio id="jukeboxAudio" controls preload="none"></audio>

    <!-- lyrics area the lyrics module expects -->
    <div class="jukebox-lyrics-window">
      <div class="lyrics-scroll"></div>
    </div>

    <!-- host for tap controls -->
    <div id="lyricsControls"></div>
  </main>

  <!-- Fallback lyrics loader (no regex) -->
  <script>
  if (typeof window.jukeboxLoadLyrics !== 'function') {
    window.jukeboxLoadLyrics = async function(path, audioEl, wrapper) {
      try {
        // normalize path: allow leading slash or not
        const url = path.startsWith('/') ? path : '/' + path;
        const r = await fetch(url);
        if (!r.ok) throw new Error('fetch failed ' + r.status);
        const txt = await r.text();
        const lines = txt.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

        // parse [mm:ss(.ms)?]text lines without regex to avoid syntax issues
        const parsed = [];
        for (const line of lines) {
          if (!line.startsWith('[')) continue;
          const close = line.indexOf(']');
          if (close === -1) continue;
          const stamp = line.slice(1, close); // mm:ss(.ms)?
          const text = line.slice(close + 1).trim();
          const parts = stamp.split(':');
          if (parts.length < 2) continue;
          const min = parseInt(parts[0], 10);
          const secParts = parts[1].split('.');
          const sec = parseInt(secParts[0], 10);
          const frac = secParts[1] ? parseFloat('0.' + secParts[1]) : 0;
          if (Number.isFinite(min) && Number.isFinite(sec)) {
            parsed.push({ time: min * 60 + sec + frac, text: text });
          }
        }

        // If a wrapper was provided, try to render simple lines into .lyrics-scroll
        try {
          const scroll = (wrapper && wrapper.querySelector && wrapper.querySelector('.lyrics-scroll')) || document.querySelector('.lyrics-scroll');
          if (scroll) {
            scroll.innerHTML = '';
            parsed.forEach((ln, i) => {
              const d = document.createElement('div');
              d.className = 'lyric-line';
              d.dataset.time = ln.time;
              d.textContent = ln.text;
              scroll.appendChild(d);
            });
          }
        } catch (e) {
          // non-fatal rendering error
          console.warn('lyrics render warning', e);
        }

        return parsed;
      } catch (e) {
        console.error('jukeboxLoadLyrics fallback error:', e);
        return [];
      }
    };
  }
  </script>

  <!-- load the existing jukebox script -->
  <script src="assets/js-final/jukebox.js"></script>
</body>
</html>
