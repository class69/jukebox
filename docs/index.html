<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jukebox</title>
</head>
<body>
  <main>
    <h1>Jukebox</h1>
    <p>Use the audio control below to play the sample track.</p>

    <!-- audio element the page expects -->
    <audio id="jukeboxAudio" controls preload="none"></audio>
  </main>

  <!-- Fallback lyrics loader: defines window.jukeboxLoadLyrics only if missing -->
  <script>
  if (typeof window.jukeboxLoadLyrics !== 'function') {
    window.jukeboxLoadLyrics = async function(path) {
      try {
        const r = await fetch(path);
        if (!r.ok) throw new Error('fetch failed ' + r.status);
        const txt = await r.text();
        const raw = txt.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        const parsed = raw.map(l => {
          const m = l.match(/^

\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]

(.*)$/);
          if (m) {
            const min = parseInt(m[1], 10);
            const sec = parseInt(m[2], 10);
            const frac = m[3] ? parseFloat('0.' + m[3]) : 0;
            return { time: min * 60 + sec + frac, text: m[4].trim() };
          }
          return null;
        }).filter(Boolean);
        return parsed;
      } catch (e) {
        console.error('jukeboxLoadLyrics fallback error:', e);
        return [];
      }
    };
  }
  </script>

  <!-- load the existing jukebox script (leave path as in your repo) -->
  <script src="assets/js-final/jukebox.js"></script>
</body>
</html>
